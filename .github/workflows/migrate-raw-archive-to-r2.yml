name: migrate-raw-archive-to-r2

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    # 25k+ objects at ~1 GET+PUT each; a resumed run re-checks every one via
    # a cheap R2 HEAD but only re-downloads/re-uploads what's still missing.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Copy congress-raw and congress-backups from Supabase Storage to R2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m congress_collector.ops.migrate_raw_archive_to_r2
