name: catchup-house-backlog

on:
  workflow_dispatch:

jobs:
  catchup:
    runs-on: ubuntu-latest
    # Thousands of PDFs to download+parse can genuinely take hours; this
    # is a one-off manual run, not something collect.yml's 5-minute
    # cadence has to wait behind.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Catch up House PTR archive/parse/link backlog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python -m congress_collector.ingest.catchup_house_backlog
