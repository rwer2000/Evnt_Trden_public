name: collect

on:
  workflow_dispatch:
  schedule:
    # Fallback only -- GitHub's own scheduler is best-effort and can lag by
    # tens of minutes to over an hour. The primary trigger is an external
    # cron service calling the REST API's workflow_dispatch endpoint on a
    # tighter cadence (every 5 min on weekday market hours, every 30 min
    # otherwise -- see README). This fallback just makes sure a run still
    # happens hourly if the external cron ever goes down.
    - cron: "17 * * * *"

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Sync House Clerk index
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m congress_collector.ingest.house

      - name: Archive House Clerk PDFs
        # From here down: if: success() || failure() on every step, so one
        # failing step (e.g. a transient 403 from efdsearch.senate.gov --
        # confirmed live, see sources/senate.py's new_session() retry) never
        # cascade-skips the rest of the pipeline. Each step only touches
        # what's already in the DB from prior runs when an earlier step in
        # *this* run didn't get to add anything new -- still useful work,
        # not a no-op. (Still excludes cancel()/being cancelled, unlike
        # always().)
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python -m congress_collector.ingest.house_pdfs

      - name: Parse House PTRs
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python -m congress_collector.ingest.house_ptrs

      - name: Sync Senate eFD index
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m congress_collector.ingest.senate

      - name: Parse Senate PTRs
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python -m congress_collector.ingest.senate_ptrs

      - name: Link filings to politicians
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m congress_collector.ingest.politician_links

      - name: Link transactions to tickers
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m congress_collector.ingest.tickers

      - name: Link House PTR amendments
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m congress_collector.ingest.amendments

      - name: Notify on failure
        # Deliberately plain curl, not the Python notifier: this step
        # must still work if an earlier step failed before `uv sync` even
        # ran (checkout, uv/Python setup itself) -- it needs nothing but
        # the token/chat ID, not a working venv.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ collect.yml failed: ${RUN_URL}"
