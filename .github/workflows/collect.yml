name: collect

on:
  workflow_dispatch:
  schedule:
    # Fallback only -- GitHub's own scheduler is best-effort and can lag by
    # tens of minutes to over an hour. The primary trigger is an external
    # cron service calling the REST API's workflow_dispatch endpoint on a
    # tighter cadence (every 5 min on weekday market hours, every 30 min
    # otherwise -- see README). This fallback just makes sure a run still
    # happens hourly if the external cron ever goes down.
    - cron: "17 * * * *"

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Sync House Clerk index
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m congress_collector.ingest.house

      # Placeholder: Senate scraping lands in T9-T11.
      - name: Sync Senate eFD index (placeholder)
        run: echo "Senate eFD scraping lands in T9-T11"
