name: _diag_senate_backfill

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Probe why a full 100-row page only yields 83 parsed entries
        run: |
          uv run python - <<'PYEOF'
          import sys
          sys.path.insert(0, "src")
          from datetime import date
          from congress_collector.sources.senate import (
              new_session, _LINK_RE, PTR_REPORT_TYPE, BASE_URL, SEARCH_DATA_URL,
          )

          session = new_session()
          csrf_token = session.cookies.get("csrftoken")
          payload = {
              "csrfmiddlewaretoken": csrf_token,
              "report_types": f"[{PTR_REPORT_TYPE}]",
              "filer_types": "[]",
              "submitted_start_date": date(2012, 1, 1).strftime("%m/%d/%Y 00:00:00"),
              "submitted_end_date": "",
              "candidate_state": "",
              "senator_state": "",
              "office_id": "",
              "first_name": "",
              "last_name": "",
              "start": "0",
              "length": "100",
          }
          response = session.post(
              SEARCH_DATA_URL,
              data=payload,
              headers={"Referer": f"{BASE_URL}/search/", "X-Requested-With": "XMLHttpRequest"},
          )
          body = response.json()
          rows = body["data"]
          print("raw row count:", len(rows))

          matched = 0
          unmatched_samples = []
          for row in rows:
              link_html = row[3]
              if _LINK_RE.search(link_html):
                  matched += 1
              elif len(unmatched_samples) < 5:
                  unmatched_samples.append(row)
          print("matched:", matched, "unmatched:", len(rows) - matched)
          for row in unmatched_samples:
              print("UNMATCHED ROW:", row)
          PYEOF
