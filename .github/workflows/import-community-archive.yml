name: import-community-archive

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Import House/Senate Stock Watcher and measure survivorship bias
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m congress_collector.ingest.community_archive
