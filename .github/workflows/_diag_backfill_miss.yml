name: _diag_backfill_miss

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Reparse a filing that didn't get backfilled and inspect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          uv run python - <<'EOF'
          from congress_collector.parsers.house_ptr import extract_pages_words, parse_ptr_transactions
          from congress_collector.storage.supabase_storage import download

          key = "house/2026/20035175.pdf"
          content = download(key)
          pages_words = extract_pages_words(content)
          results = parse_ptr_transactions(pages_words)
          print(f"parsed {len(results)} transactions from {key}")
          for t in results:
              print(f"row={t.row_index} source_id={t.source_transaction_id!r} "
                    f"owner={t.owner} asset={t.asset_description_raw[:50]!r}")

          print()
          print("### raw word-level layout of the first transaction row ###")
          for page in pages_words:
              for w in page:
                  if w.x0 < 70 and "GS" not in w.text:
                      pass
          # print all words with x0 < 70 across the whole doc, with context
          for page_num, page in enumerate(pages_words):
              from collections import defaultdict
              rows = defaultdict(list)
              for w in page:
                  rows[round(w.top)].append(w)
              for top in sorted(rows):
                  row = sorted(rows[top], key=lambda w: w.x0)
                  leftmost = [w for w in row if w.x0 < 70]
                  if leftmost:
                      print(f"page {page_num} top={top}: " + " | ".join(f"x0={w.x0:.1f} {w.text!r}" for w in row[:6]))
          EOF
