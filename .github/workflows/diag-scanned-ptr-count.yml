name: "Diagnostic: count scanned/paper PTR filings"

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Count scanned/paper PTR filings by chamber and year (read-only)
        run: |
          uv run python - <<'PYEOF'
          from sqlalchemy import func, select

          from congress_collector.db.models import Filing
          from congress_collector.db.session import session_scope

          with session_scope() as session:
              total = session.scalar(
                  select(func.count()).select_from(Filing).where(
                      Filing.filing_type == "P",
                      Filing.format == "scanned",
                  )
              )
              print(f"Total scanned PTR filings (both chambers, all years): {total}")

              rows = session.execute(
                  select(
                      Filing.chamber,
                      func.extract("year", Filing.filed_date),
                      func.count(),
                  )
                  .where(Filing.filing_type == "P", Filing.format == "scanned")
                  .group_by(Filing.chamber, func.extract("year", Filing.filed_date))
                  .order_by(Filing.chamber, func.extract("year", Filing.filed_date))
              ).all()
              for chamber, year, count in rows:
                  print(f"  {chamber} {int(year) if year else 'unknown'}: {count}")

              with_pdf = session.scalar(
                  select(func.count()).select_from(Filing).where(
                      Filing.filing_type == "P",
                      Filing.format == "scanned",
                      Filing.raw_object_key.is_not(None),
                  )
              )
              print(f"Of those, {with_pdf} have an archived PDF (raw_object_key set).")
          PYEOF
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
