name: legislators

on:
  workflow_dispatch:
  schedule:
    # Congress membership changes rarely (elections, resignations,
    # deaths/appointments) -- weekly is more than enough, and keeps this off
    # collect.yml's tight 5-minute cadence where a ~10MB YAML download would
    # be pure waste on every run.
    - cron: "0 5 * * 1" # every Monday 05:00 UTC

concurrency:
  group: legislators
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Sync congress-legislators
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m congress_collector.ingest.legislators
