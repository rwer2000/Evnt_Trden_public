name: _diag_ptr_pdf

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Download a handful of real PTR PDFs
        run: |
          mkdir -p ptr_samples
          cat > diag.py << 'PYEOF'
          import io
          import zipfile
          from xml.etree import ElementTree

          import httpx

          client = httpx.Client(follow_redirects=True, timeout=30.0, headers={
              "User-Agent": "congress-collector-diag (research use, contact via github.com/rwer2000)"
          })

          year = 2026
          r = client.get(f"https://disclosures-clerk.house.gov/public_disc/financial-pdfs/{year}FD.zip")
          zf = zipfile.ZipFile(io.BytesIO(r.content))
          xml_name = next(n for n in zf.namelist() if n.lower().endswith(".xml"))
          root = ElementTree.fromstring(zf.read(xml_name))

          ptr_doc_ids = [
              m.findtext("DocID")
              for m in root.findall("Member")
              if (m.findtext("FilingType") or "") == "P"
          ]
          print(f"Found {len(ptr_doc_ids)} PTR filings in {year} index; downloading 8 samples.")

          for doc_id in ptr_doc_ids[:8]:
              url = f"https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/{year}/{doc_id}.pdf"
              resp = client.get(url)
              print(doc_id, resp.status_code, len(resp.content))
              if resp.status_code == 200:
                  with open(f"ptr_samples/{doc_id}.pdf", "wb") as f:
                      f.write(resp.content)
          PYEOF
          uv run --with httpx python diag.py

      - name: Upload samples as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptr-samples
          path: ptr_samples/
          retention-days: 1
