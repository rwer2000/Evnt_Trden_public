name: _diag_house

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Probe House Clerk disclosure site
        run: |
          cat > diag.py << 'PYEOF'
          import io
          import zipfile

          import httpx

          client = httpx.Client(follow_redirects=True, timeout=20.0, headers={
              "User-Agent": "congress-collector-diag (research use, contact via github.com/rwer2000)"
          })

          print("=== Landing page ===")
          for url in [
              "https://disclosures-clerk.house.gov/FinancialDisclosure",
              "https://disclosures-clerk.house.gov/PublicDisclosure/FinancialDisclosure",
          ]:
              try:
                  r = client.get(url)
                  print(url, "->", r.status_code, len(r.text))
                  if r.status_code == 200:
                      text = r.text
                      idx = text.lower().find(".zip")
                      while idx != -1:
                          print("  ...", text[max(0, idx - 120):idx + 10].replace("\n", " "))
                          idx = text.lower().find(".zip", idx + 1)
              except Exception as e:
                  print(url, "-> ERROR", repr(e))

          print()
          print("=== Candidate ZIP URLs ===")
          candidates = [
              "https://disclosures-clerk.house.gov/public_disc/financial-pdfs/2026FD.zip",
              "https://disclosures-clerk.house.gov/public_disc/financial-pdfs/2025FD.zip",
              "https://disclosures-clerk.house.gov/public_disc/financial-pdfs/2026FD.ZIP",
          ]
          for url in candidates:
              try:
                  r = client.get(url)
                  ct = r.headers.get("content-type")
                  print(url, "->", r.status_code, ct, len(r.content))
                  if r.status_code == 200 and "zip" in (ct or "").lower() or r.content[:2] == b"PK":
                      zf = zipfile.ZipFile(io.BytesIO(r.content))
                      names = zf.namelist()
                      print("  zip contents:", names)
                      for name in names:
                          if name.lower().endswith(".xml"):
                              data = zf.read(name)
                              print(f"  --- first 3000 chars of {name} ---")
                              print(data[:3000].decode("utf-8", errors="replace"))
              except Exception as e:
                  print(url, "-> ERROR", repr(e))
          PYEOF
          uv run --with httpx python diag.py
