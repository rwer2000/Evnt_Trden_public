name: "Diagnostic: count House PTRs still marked parse_status=failed"

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Count filings still parse_status='failed' (read-only)
        run: |
          uv run python - <<'PYEOF'
          from sqlalchemy import func, select

          from congress_collector.db.models import Filing
          from congress_collector.db.session import session_scope
          from congress_collector.ingest.reparse_failed_house_ptrs import _failed_filings

          with session_scope() as session:
              total_failed = session.scalar(
                  select(func.count()).select_from(Filing).where(
                      Filing.chamber == "house",
                      Filing.filing_type == "P",
                      Filing.parse_status == "failed",
                  )
              )
              print(f"House PTRs currently parse_status='failed': {total_failed}")

          eligible = _failed_filings()
          print(f"Of those, {len(eligible)} have an archived PDF (raw_object_key set) and are eligible for reparse.")
          PYEOF
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
