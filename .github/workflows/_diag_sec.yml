name: _diag_sec

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch SEC company_tickers.json
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://www.sec.gov/files/company_tickers.json",
              headers={
                  "User-Agent": "congress-collector rwer2000-github@users.noreply.github.com"
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("status:", resp.status)
                  print("content-type:", resp.headers.get("Content-Type"))
                  body = resp.read()
                  print("bytes:", len(body))
                  data = json.loads(body)
                  print("entries:", len(data))
                  items = list(data.items())[:5]
                  for k, v in items:
                      print(k, v)
          except urllib.error.HTTPError as e:
              print("HTTPError", e.code)
              print("headers:", dict(e.headers))
              print("body:", e.read()[:2000])
          EOF

      - name: Try data.sec.gov (different subdomain/infra) for comparison
        if: always()
        run: |
          python3 - <<'EOF'
          import urllib.request
          import urllib.error

          req = urllib.request.Request(
              "https://data.sec.gov/submissions/CIK0000320193.json",
              headers={
                  "User-Agent": "congress-collector rwer2000-github@users.noreply.github.com"
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("status:", resp.status)
                  body = resp.read()
                  print("bytes:", len(body))
                  print("first 200 bytes:", body[:200])
          except urllib.error.HTTPError as e:
              print("HTTPError", e.code)
              print("body:", e.read()[:500])
          EOF

      - name: Retry www.sec.gov after a delay
        if: always()
        run: |
          sleep 20
          python3 - <<'EOF'
          import urllib.request
          import urllib.error

          req = urllib.request.Request(
              "https://www.sec.gov/files/company_tickers.json",
              headers={
                  "User-Agent": "congress-collector rwer2000-github@users.noreply.github.com"
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("status:", resp.status)
                  body = resp.read()
                  print("bytes:", len(body))
          except urllib.error.HTTPError as e:
              print("HTTPError", e.code)
              print("body:", e.read()[:500])
          EOF
