name: _diag_sec

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch SEC company_tickers.json
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://www.sec.gov/files/company_tickers.json",
              headers={
                  "User-Agent": "congress-collector (personal research use; github.com/rwer2000/Evnt_Trden_public)"
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("status:", resp.status)
              print("content-type:", resp.headers.get("Content-Type"))
              body = resp.read()
              print("bytes:", len(body))
              data = json.loads(body)
              print("entries:", len(data))
              items = list(data.items())[:5]
              for k, v in items:
                  print(k, v)
          EOF

      - name: Also fetch company_tickers_exchange.json for comparison
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://www.sec.gov/files/company_tickers_exchange.json",
              headers={
                  "User-Agent": "congress-collector (personal research use; github.com/rwer2000/Evnt_Trden_public)"
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("status:", resp.status)
              body = resp.read()
              data = json.loads(body)
              print("fields:", data.get("fields"))
              print("sample rows:", data.get("data", [])[:5])
              print("total rows:", len(data.get("data", [])))
          EOF
