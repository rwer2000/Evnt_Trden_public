name: _diag_ptr_layout

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Probe layout=True text and word positions
        run: |
          cat > diag.py << 'PYEOF'
          import io

          import httpx
          import pdfplumber

          client = httpx.Client(follow_redirects=True, timeout=30.0, headers={
              "User-Agent": "congress-collector-diag (research use, contact via github.com/rwer2000)"
          })

          # 20033751: single-page, has an amount range that wraps ("$15,001 -" / "$50,000")
          # 20034201: multi-page, partial sales, long Description annotation
          cases = [("20033751", 2026), ("20034201", 2026)]

          for doc_id, year in cases:
              url = f"https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/{year}/{doc_id}.pdf"
              r = client.get(url)
              print(f"=== DocID {doc_id} ===")
              with pdfplumber.open(io.BytesIO(r.content)) as pdf:
                  page = pdf.pages[0]
                  print("--- extract_text(layout=True) ---")
                  print(page.extract_text(layout=True))
                  print()
                  print("--- extract_words() (first 60) ---")
                  words = page.extract_words()
                  for w in words[:60]:
                      print(
                          f"  x0={w['x0']:.1f} x1={w['x1']:.1f} top={w['top']:.1f} "
                          f"bottom={w['bottom']:.1f} text={w['text']!r}"
                      )
              print()
          PYEOF
          uv run --with httpx --with pdfplumber python diag.py
