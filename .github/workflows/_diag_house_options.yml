name: _diag_house_options

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Inspect a real House PTR option filing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          uv run python - <<'EOF'
          import pdfplumber
          import io
          from congress_collector.storage.supabase_storage import download

          for key in ["house/2026/20035024.pdf", "house/2026/20034305.pdf"]:
              print("=" * 20, key)
              content = download(key)
              with pdfplumber.open(io.BytesIO(content)) as pdf:
                  for page_num, page in enumerate(pdf.pages):
                      text = page.extract_text(layout=True) or ""
                      if "META" in text or "MSFT" in text or "Option" in text or "OP" in text:
                          print(f"--- page {page_num} ---")
                          print(text)
          EOF
