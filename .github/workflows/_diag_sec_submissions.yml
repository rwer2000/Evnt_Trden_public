name: _diag_sec_submissions

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Try data.sec.gov submissions API (plain)
        run: |
          curl -sS -i -A "Mozilla/5.0" \
            "https://data.sec.gov/submissions/CIK0000320193.json" \
            --max-time 20 || echo "curl failed: $?"

      - name: Try data.sec.gov submissions API (SEC-recommended UA)
        run: |
          curl -sS -i -A "congress-collector (personal research use; github.com/rwer2000/Evnt_Trden_public)" \
            "https://data.sec.gov/submissions/CIK0000320193.json" \
            --max-time 20 || echo "curl failed: $?"

      - name: Try www.sec.gov company_tickers.json for comparison
        run: |
          curl -sS -i -A "congress-collector (personal research use; github.com/rwer2000/Evnt_Trden_public)" \
            "https://www.sec.gov/files/company_tickers.json" \
            --max-time 20 -o /dev/null -w "\nHTTP %{http_code}\n" || echo "curl failed: $?"
