name: _diag_stock_watcher

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Search GitHub for House Stock Watcher's current data repo
        run: |
          uv run python - <<'PYEOF'
          import httpx

          UA = "congress-collector (personal research use; github.com/rwer2000/Evnt_Trden_public)"
          client = httpx.Client(follow_redirects=True, timeout=30.0, headers={"User-Agent": UA})

          for query in ["house-stock-watcher", "house stock watcher data", "housestockwatcher"]:
              print(f"=== search: {query!r} ===")
              resp = client.get(
                  "https://api.github.com/search/repositories",
                  params={"q": query, "sort": "updated", "order": "desc", "per_page": 10},
              )
              print("status:", resp.status_code)
              if resp.status_code == 200:
                  for item in resp.json().get("items", []):
                      print(
                          f"  {item['full_name']}  pushed_at={item['pushed_at']}  "
                          f"archived={item['archived']}  desc={item.get('description')!r}"
                      )
              print()

          # Also try the site directly (in case it self-hosts its own JSON export).
          for url in [
              "https://housestockwatcher.com/api/transactions",
              "https://housestockwatcher.com/data/all_transactions.json",
              "https://www.quiverquant.com/congresstrading/",
          ]:
              print(f"=== direct: {url} ===")
              try:
                  resp = client.get(url)
                  print("status:", resp.status_code, "content-type:", resp.headers.get("content-type"))
              except Exception as e:
                  print("ERROR:", repr(e))
              print()
          PYEOF
