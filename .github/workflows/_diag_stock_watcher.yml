name: _diag_stock_watcher

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Inspect TattooedHead/house-stock-watcher-data and look for an active Senate counterpart
        run: |
          uv run python - <<'PYEOF'
          import json
          import httpx

          UA = "congress-collector (personal research use; github.com/rwer2000/Evnt_Trden_public)"
          client = httpx.Client(follow_redirects=True, timeout=30.0, headers={"User-Agent": UA})

          print("=== repo metadata: TattooedHead/house-stock-watcher-data ===")
          resp = client.get("https://api.github.com/repos/TattooedHead/house-stock-watcher-data")
          print("status:", resp.status_code)
          if resp.status_code == 200:
              info = resp.json()
              print("description:", info.get("description"))
              print("license:", info.get("license"))
              print("default_branch:", info.get("default_branch"))
              print("pushed_at:", info.get("pushed_at"))
          print()

          print("=== repo file tree (top level + data/) ===")
          resp = client.get(
              "https://api.github.com/repos/TattooedHead/house-stock-watcher-data/git/trees/main"
          )
          print("status:", resp.status_code)
          top_level = []
          if resp.status_code == 200:
              top_level = [e["path"] for e in resp.json().get("tree", [])]
              print("top level:", top_level)
          if "data" in top_level:
              resp2 = client.get(
                  "https://api.github.com/repos/TattooedHead/house-stock-watcher-data/contents/data"
              )
              if resp2.status_code == 200:
                  print("data/ contents:", [f["name"] for f in resp2.json()])
          print()

          for candidate in [
              "https://raw.githubusercontent.com/TattooedHead/house-stock-watcher-data/main/data/all_transactions.json",
              "https://raw.githubusercontent.com/TattooedHead/house-stock-watcher-data/main/all_transactions.json",
          ]:
              print(f"=== try: {candidate} ===")
              resp = client.get(candidate)
              print("status:", resp.status_code)
              if resp.status_code == 200:
                  print("content-length:", len(resp.content))
                  try:
                      data = resp.json()
                      print("type: list, len:", len(data))
                      print("sample[0]:", json.dumps(data[0], indent=2)[:1200])
                  except Exception as e:
                      print("parse error:", e)
              print()

          print("=== search: active Senate stock watcher forks/successors ===")
          for query in ["senate-stock-watcher", "senate stock watcher data"]:
              resp = client.get(
                  "https://api.github.com/search/repositories",
                  params={"q": query, "sort": "updated", "order": "desc", "per_page": 8},
              )
              print(f"-- query {query!r} status={resp.status_code}")
              if resp.status_code == 200:
                  for item in resp.json().get("items", []):
                      print(
                          f"  {item['full_name']}  pushed_at={item['pushed_at']}  "
                          f"archived={item['archived']}  desc={item.get('description')!r}"
                      )
          PYEOF
